        }
        /* Custom scroll behavior for anchor links */
        html {
            scroll-behavior: smooth;
        }
        /* Style for the special MP-3000 TH entry */
        .special-instruction {
            color: #ea580c; /* Orange-600 */
            font-style: italic;
            padding: 0.5rem 0;
            display: block;
        }
        /* Custom colors for links to differentiate them */
        .download-link {
            @apply text-orange-600 hover:text-orange-800 transition duration-150 ease-in-out;

        .utility-link {
            @apply text-gray-600 hover:text-gray-900 transition duration-150 ease-in-out font-medium;
        }

        /* Estilos adicionados para o formulário de login */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .login-form-container {
            background-color: white;
            padding: 2.5rem;
            border-radius: 0.75rem;
            border-top: 6px solid #f97316; /* Orange-500 */
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            max-width: 400px;
            width: 90%;
        }

        const contentContainer = document.getElementById('content-container');

        // FUNÇÕES DE AUTENTICAÇÃO
        function checkLogin() {
            if (localStorage.getItem(AUTH_KEY) === 'true') {
                loginOverlay.classList.add('hidden');
                mainContent.classList.remove('hidden');
                renderContent(); // Chama a renderização do conteúdo se logado
            } else {
                loginOverlay.classList.remove('hidden');
                mainContent.classList.add('hidden');
            }
        }

        function doLogin(event) {
            event.preventDefault(); // Evita o recarregamento da página

            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;

            if (usernameInput === VALID_USERNAME && passwordInput === VALID_PASSWORD) {
                localStorage.setItem(AUTH_KEY, 'true');
                loginMessage.classList.add('hidden');
                checkLogin();
            } else {
                loginMessage.textContent = 'Usuário ou senha inválidos.';
                loginMessage.classList.remove('hidden');
            }
        }

        window.doLogout = function() { // Exposta globalmente para o botão Sair
            localStorage.removeItem(AUTH_KEY);
            checkLogin();
        }

        // Adiciona o listener para o formulário de login
        loginForm.addEventListener('submit', doLogin);

        // Funções de Renderização

        // Function to create a link element
        function createLink(text, url, className = 'download-link') {
            if (!url || url.includes('Manual')) {
                className = 'text-gray-400 hover:text-gray-600 transition duration-150 ease-in-out';
            } else if (className === 'utility-link') {
                className = 'text-gray-600 hover:text-gray-900 transition duration-150 ease-in-out font-medium';
            }
            const a = document.createElement('a');
            a.href = url;
            a.textContent = text;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.className = className;
            return a;
        }
        
        // Function to render the main table for a brand
        function renderModelsTable(brandData, headerColorClass = 'bg-orange-500') {
            let html = '';
            
            html += `
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200 shadow-md rounded-lg overflow-hidden mb-4">
                        <thead class="${headerColorClass}">
                            <tr>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider w-1/4">Modelo</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider w-1/4">Versão</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider w-1/2">Download</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
            `;
            
            brandData.models.forEach(model => {
                html += '<tr>';
                html += `<td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${model.model}</td>`;
                html += `<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${model.version}</td>`;
                
                html += `<td class="px-6 py-4 text-sm text-gray-700 space-x-3 whitespace-normal">`;
                
                if (model.model.includes('MP-3000 TH') && model.downloads[0].name.includes('Deve ser instalada')) {
                    html += `<span class="special-instruction">Deve ser instalada com o driver Generic do Windows</span>`;
                }
                
                model.downloads.forEach((dl, index) => {
                    if (model.model.includes('MP-3000 TH') && dl.name.includes('Deve ser instalada')) {
                        // Skip text link
                    } else {
                        html += `<a href="${dl.url}" target="_blank" rel="noopener noreferrer" class="download-link text-xs sm:text-sm font-medium hover:underline">`;
                        html += `[${dl.name}]`;
                        html += `</a>`;
                        if (index < model.downloads.length - 1) {
                            html += ' - ';
                        }
                    }
                });
                
                html += `</td>`;
                html += '</tr>';
            });

            html += '</tbody></table></div>';
            return html;
        }

        // Function to render utility links below the table
        function renderUtilities(utilities) {
            if (utilities.length === 0) return '';
            
            let html = '<div class="mt-4 mb-8 p-4 bg-gray-100 rounded-lg border border-gray-300 shadow-sm">';
            html += '<p class="font-semibold text-gray-700 mb-2">Utilitários e Complementos:</p>';
            html += '<div class="flex flex-wrap gap-x-4 gap-y-2">';
            
            utilities.forEach((utility, index) => {
                const linkElement = createLink(utility.name, utility.url, 'utility-link');
                html += `<span class="whitespace-nowrap">[${linkElement.outerHTML}]</span>`;
                if (index < utilities.length - 1) {
                    html += '';
                }
            });
            
            html += '</div></div>';
            return html;
        }

        // Main rendering function
        function renderContent() {
            let html = '';

            // 1. Ferramentas Auxiliares
            html += `
                <div class="bg-white p-6 rounded-xl shadow-lg mb-8 border-l-4 border-gray-500">
                    <h2 class="text-2xl font-bold text-gray-700 mb-3">Ferramentas Auxiliares</h2>
                    <ul class="list-disc list-inside space-y-1">
                        ${printerData.auxiliaryTools.map(tool => `
                            <li>
                                <a href="${tool.url}" target="_blank" rel="noopener noreferrer" class="text-orange-600 hover:text-orange-800 transition duration-150 ease-in-out font-medium">${tool.name}</a>
                            </li>
                        `).join('')}
                    </ul>
                </div>
            `;

            // 2. Control Printers & Driver Removal Command
            html += `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    <div class="bg-gray-200 p-6 rounded-xl shadow-lg border-l-4 border-gray-600">
                        <h2 class="text-xl font-bold text-gray-700 mb-3">Abrir Control Printers (Win 11)</h2>
                        <p class="text-sm text-gray-700 mb-2">Rodar no Executar (<code class="bg-gray-300 p-1 rounded font-mono">Win + R</code>):</p>
                        <div class="bg-white p-3 rounded-lg border border-gray-400 font-mono text-xs text-gray-800 break-all">
                            ${printerData.windowsCommand}
                        </div>
                    </div>

                    <div class="bg-orange-100 p-6 rounded-xl shadow-lg border-l-4 border-orange-500">
                        <h2 class="text-xl font-bold text-gray-800 mb-3">Remoção Avançada de Drivers</h2>
                        <p class="text-sm text-gray-800 mb-2">Para drivers que não excluem pelo Painel de Controle (<code class="bg-orange-200 p-1 rounded font-mono">Win + R</code>):</p>
                        <ul class="space-y-3 mt-2">
                            <li>
                                <code class="bg-white p-1 rounded font-mono text-xs border border-orange-300">printui /s /t2</code>
                                <p class="text-xs text-orange-900 mt-1">Abre a aba de Drivers diretamente para remover o driver e o pacote.</p>
                            </li>
                            <li>
                                <code class="bg-white p-1 rounded font-mono text-xs border border-orange-300">printmanagement.msc</code>
                                <p class="text-xs text-orange-900 mt-1">Gerenciamento centralizado de impressoras, portas e drivers (Versões Pro/Enterprise).</p>
                            </li>
                        </ul>
                    </div>
                </div>
            `;

            // 3. Navigation Index (Thermal Printers)
            html += `
                <div class="p-6 bg-white rounded-xl shadow-lg mb-8">
                    <h3 class="text-xl font-semibold text-gray-700 mb-3">Marcas Térmicas (Rolos)</h3>
                    <div class="flex flex-wrap gap-2 text-sm">
                        ${Object.keys(printerData.thermalBrands).map(brand => `
                            <a href="#${printerData.thermalBrands[brand].anchor}" class="px-3 py-1 bg-orange-100 text-orange-700 rounded-full hover:bg-orange-200 transition duration-150 ease-in-out border border-orange-200">${brand}</a>
                        `).join('')}
                    </div>
                    
                    <h3 class="text-xl font-semibold text-gray-700 mt-6 mb-3 border-t pt-4">Marcas Etiquetas (Labels)</h3>
                    <div class="flex flex-wrap gap-2 text-sm">
                        ${Object.keys(printerData.labelBrands).map(brandKey => {
                            const brandName = brandKey.replace('_Etiqueta', '');
                            const brandData = printerData.labelBrands[brandKey];
                            return `<a href="#${brandData.anchor}" class="px-3 py-1 bg-gray-200 text-gray-700 rounded-full hover:bg-gray-300 transition duration-150 ease-in-out border border-gray-300">${brandName}</a>`;
                        }).join('')}
                    </div>
                </div>
            `;

            // 4. Render Thermal Brands Sections
            Object.keys(printerData.thermalBrands).forEach(brandName => {
                const brand = printerData.thermalBrands[brandName];
                html += `
                    <div class="bg-white p-6 rounded-xl shadow-lg mb-10 border-t-8 border-orange-500" id="${brand.anchor}">
                        <h2 class="text-3xl font-bold text-gray-800 mb-4">${brandName}</h2>
                        ${renderModelsTable(brand, 'bg-orange-500')}
                        ${renderUtilities(brand.utilities)}
                        <a href="#top" class="text-sm text-gray-400 hover:text-orange-600 transition duration-150 ease-in-out mt-4 block">Voltar ao topo ↑</a>
                    </div>
                `;
            });

            // 5. Section Separator for Label Printers
            html += `
                <h1 class="text-4xl font-extrabold text-gray-800 mb-8 mt-12 border-b-4 border-gray-500 pb-3" id="IMPRESSORAS_DE_ETIQUETA">IMPRESSORAS DE ETIQUETA</h1>
            `;

            // 6. Render Label Brands Sections
            Object.keys(printerData.labelBrands).forEach(brandKey => {
                const brandName = brandKey.replace('_Etiqueta', '');
                const brand = printerData.labelBrands[brandKey];
                
                html += `
                    <div class="bg-white p-6 rounded-xl shadow-lg mb-10 border-t-8 border-gray-600" id="${brand.anchor}">
                        <h2 class="text-3xl font-bold text-gray-800 mb-4">${brandName} (Etiqueta)</h2>
                        ${renderModelsTable(brand, 'bg-gray-600')}
                        ${renderUtilities(brand.utilities)}
                        <a href="#top" class="text-sm text-gray-400 hover:text-gray-600 transition duration-150 ease-in-out mt-4 block">Voltar ao topo ↑</a>
                    </div>
                `;
            });

            contentContainer.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', checkLogin);
    </script>
