                },
                "Zebra_Etiqueta": {
                    anchor: "Zebra_Etiqueta",
                    models: [
                        { model: "Zebra", version: "0.0.0.0", downloads: [{ name: "Driver", url: "https://drive.google.com/drive/folders/1fCnX5lCfFnQkI0u3UFKaMD8_ZAnpWNE6?usp=drive_link" }] }
                    ],
                    utilities: []
                }
            }
        };

        const contentContainer = document.getElementById('content-container');

        // Function to create a link element
        function createLink(text, url, className = 'download-link') {
            if (!url || url.includes('Manual')) {
                // If it's a manual or a link is missing/empty, treat it as informational
                className = 'text-gray-500 hover:text-gray-700 transition duration-150 ease-in-out';
            } else if (className === 'utility-link') {
                className = 'text-purple-600 hover:text-purple-800 transition duration-150 ease-in-out';
            }
            const a = document.createElement('a');
            a.href = url;
            a.textContent = text;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.className = className;
            return a;
        }
        
        // Function to render the main table for a brand
        function renderModelsTable(brandData) {
            let html = '';
            
            // Check for the special MP-3000 TH instruction (Bematech)
            const mp3000Entry = brandData.models.find(m => m.model.includes('MP-3000 TH'));
            
            // Generate Table Header
            html += `
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200 shadow-md rounded-lg overflow-hidden mb-4">
                        <thead class="bg-blue-500">
                            <tr>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider w-1/4">Modelo</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider w-1/4">Versão</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider w-1/2">Download</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
            `;
            
            // Generate Table Rows
            brandData.models.forEach(model => {
                html += '<tr>';
                html += `<td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${model.model}</td>`;
                html += `<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${model.version}</td>`;
                
                // Downloads column
                html += `<td class="px-6 py-4 text-sm text-gray-700 space-x-3 whitespace-normal">`;
                
                if (model.model.includes('MP-3000 TH') && model.downloads[0].name.includes('Deve ser instalada')) {
                    // Special case for MP-3000 TH
                    html += `<span class="special-instruction">Deve ser instalada com o driver Generic do Windows</span>`;
                }
                
                model.downloads.forEach((dl, index) => {
                    // Check if it's the special instruction link content
                    if (model.model.includes('MP-3000 TH') && dl.name.includes('Deve ser instalada')) {
                        // Skip the special instruction link as text is already shown above, only show Manual
                    } else {
                        html += `<a href="${dl.url}" target="_blank" rel="noopener noreferrer" class="download-link text-xs sm:text-sm font-medium hover:underline">`;
                        html += `[${dl.name}]`;
                        html += `</a>`;
                        if (index < model.downloads.length - 1) {
                            html += ' - ';
                        }
                    }
                });
                
                html += `</td>`;
                html += '</tr>';
            });

            html += '</tbody></table></div>';
            return html;
        }

        // Function to render utility links below the table
        function renderUtilities(utilities) {
            if (utilities.length === 0) return '';
            
            let html = '<div class="mt-4 mb-8 p-4 bg-purple-50 rounded-lg border border-purple-200 shadow-sm">';
            html += '<p class="font-semibold text-purple-700 mb-2">Utilitários e Complementos:</p>';
            html += '<div class="flex flex-wrap gap-x-4 gap-y-2">';
            
            utilities.forEach((utility, index) => {
                const linkElement = createLink(utility.name, utility.url, 'utility-link');
                html += `<span class="whitespace-nowrap">[${linkElement.outerHTML}]</span>`;
                if (index < utilities.length - 1) {
                    html += '';
                }
            });
            
            html += '</div></div>';
            return html;
        }

        // Main rendering function
        function renderContent() {
            let html = '';

            // 1. Ferramentas Auxiliares
            html += `
                <div class="bg-gray-100 p-6 rounded-xl shadow-lg mb-8">
                    <h2 class="text-2xl font-bold text-gray-700 mb-3">Ferramentas Auxiliares</h2>
                    <ul class="list-disc list-inside space-y-1">
                        ${printerData.auxiliaryTools.map(tool => `
                            <li>
                                <a href="${tool.url}" target="_blank" rel="noopener noreferrer" class="text-indigo-600 hover:text-indigo-800 transition duration-150 ease-in-out font-medium">${tool.name}</a>
                            </li>
                        `).join('')}
                    </ul>
                </div>
            `;

            // 2. Control Printers Command
            html += `
                <div class="bg-yellow-100 p-6 rounded-xl shadow-lg mb-8 border-l-4 border-yellow-500">
                    <h2 class="text-2xl font-bold text-gray-700 mb-3">Abrir o Control Printers clássico no Windows 11 atualizado</h2>
                    <p class="text-sm sm:text-base text-gray-700 mb-2">Rodar o seguinte comando no Executar (<code class="bg-yellow-200 p-1 rounded font-mono">Win + R</code>):</p>
                    <div class="bg-yellow-50 p-3 rounded-lg border border-yellow-300 font-mono text-sm text-yellow-800 break-all">
                        ${printerData.windowsCommand}
                    </div>
                </div>
            `;

            // 3. Navigation Index (Thermal Printers)
            html += `
                <div class="p-6 bg-white rounded-xl shadow-lg mb-8">
                    <h3 class="text-xl font-semibold text-gray-700 mb-3">Marcas Térmicas (Rolos)</h3>
                    <div class="flex flex-wrap gap-2 text-sm">
                        ${Object.keys(printerData.thermalBrands).map(brand => `
                            <a href="#${printerData.thermalBrands[brand].anchor}" class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full hover:bg-blue-200 transition duration-150 ease-in-out">${brand}</a>
                        `).join('')}
                    </div>
                    
                    <h3 class="text-xl font-semibold text-gray-700 mt-6 mb-3 border-t pt-4">Marcas Etiquetas (Labels)</h3>
                    <div class="flex flex-wrap gap-2 text-sm">
                        ${Object.keys(printerData.labelBrands).map(brandKey => {
                            const brandName = brandKey.replace('_Etiqueta', '');
                            const brandData = printerData.labelBrands[brandKey];
                            return `<a href="#${brandData.anchor}" class="px-3 py-1 bg-green-100 text-green-700 rounded-full hover:bg-green-200 transition duration-150 ease-in-out">${brandName}</a>`;
                        }).join('')}
                    </div>
                </div>
            `;

            // 4. Render Thermal Brands Sections
            Object.keys(printerData.thermalBrands).forEach(brandName => {
                const brand = printerData.thermalBrands[brandName];
                html += `
                    <div class="bg-white p-6 rounded-xl shadow-lg mb-10 border-t-8 border-blue-500" id="${brand.anchor}">
                        <h2 class="text-3xl font-bold text-gray-800 mb-4">${brandName}</h2>
                        ${renderModelsTable(brand)}
                        ${renderUtilities(brand.utilities)}
                        <a href="#top" class="text-sm text-gray-500 hover:text-blue-600 transition duration-150 ease-in-out mt-4 block">Voltar ao topo ↑</a>
                    </div>
                `;
            });

            // 5. Section Separator for Label Printers
            html += `
                <h1 class="text-4xl font-extrabold text-gray-800 mb-8 mt-12 border-b-4 border-green-500 pb-3" id="IMPRESSORAS_DE_ETIQUETA">IMPRESSORAS DE ETIQUETA</h1>
            `;

            // 6. Render Label Brands Sections
            Object.keys(printerData.labelBrands).forEach(brandKey => {
                const brandName = brandKey.replace('_Etiqueta', '');
                const brand = printerData.labelBrands[brandKey];
                
                // Handle the Tomate case where the table is incomplete in the source markdown
                if (brandName === 'Tomate' || brandName === 'Zebra') {
                     html += `
                        <div class="bg-white p-6 rounded-xl shadow-lg mb-10 border-t-8 border-green-500" id="${brand.anchor}">
                            <h2 class="text-3xl font-bold text-gray-800 mb-4">${brandName} (Etiqueta)</h2>
                            <p class="text-red-600 bg-red-100 p-3 rounded-md">Dados incompletos no índice original. Adicione os modelos e links aqui.</p>
                            ${renderUtilities(brand.utilities)}
                            <a href="#top" class="text-sm text-gray-500 hover:text-green-600 transition duration-150 ease-in-out mt-4 block">Voltar ao topo ↑</a>
                        </div>
                    `;
                    return; 
                }

                html += `
                    <div class="bg-white p-6 rounded-xl shadow-lg mb-10 border-t-8 border-green-500" id="${brand.anchor}">
                        <h2 class="text-3xl font-bold text-gray-800 mb-4">${brandName} (Etiqueta)</h2>
                        ${renderModelsTable(brand)}
                        ${renderUtilities(brand.utilities)}
                        <a href="#top" class="text-sm text-gray-500 hover:text-green-600 transition duration-150 ease-in-out mt-4 block">Voltar ao topo ↑</a>
                    </div>
                `;
            });


            contentContainer.innerHTML = html;
        }

        // Run the main rendering function when the page loads
        document.addEventListener('DOMContentLoaded', renderContent);
    </script>
</body>
</html>
